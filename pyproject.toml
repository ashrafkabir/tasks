[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "0.1.0"
description = "Local-first agentic OS for CxO consulting workflow"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openclaw = "openclaw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw*"]
exclude = ["tests*", "vault*", "tasks*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
