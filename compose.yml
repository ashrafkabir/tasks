# OC-025 — Consilo service stack.
#
# Containerizes the stateless support services that benefit from being managed
# together. llama-server (chat + embeddings) intentionally stays on the host
# because the user already maintains a tuned llama.cpp build there and GPU
# passthrough is not free.
#
# Usage:
#   docker compose up -d            # start everything below
#   docker compose ps               # see what's up
#   docker compose logs -f wuzapi   # tail one service
#   docker compose down             # stop everything (keeps volumes)
#
# Ports (all bound to 127.0.0.1 by default):
#   6333  Qdrant HTTP API
#   8888  SearXNG
#   8089  wuzapi (WhatsApp bridge)
#   8090  Consilo bridge HTTP server (wuzapi webhook receiver)
#   8091  Consilo dashboard
#
# llama-servers stay on the host:
#   8080  chat            (make llama-chat)
#   8081  embeddings      (make llama-embed)

services:

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant-server:/qdrant/storage

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - INSTANCE_NAME=consilo-local
      - BASE_URL=http://127.0.0.1:8888/
    volumes:
      - ./infra/searxng:/etc/searxng:rw

  wuzapi:
    image: asternic/wuzapi:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN:-change-me-admin-token}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/wuzapi:/app/dbdata

  consilo-bridge:
    build:
      context: .
      dockerfile: infra/Dockerfile.consilo
    image: consilo:local
    restart: unless-stopped
    command: ["python", "-m", "consilo.bridges.server"]
    network_mode: "host"             # so it can reach llama-server / wuzapi on 127.0.0.1
    env_file:
      - .env
    environment:
      - CONSILO_BRIDGE_HOST=0.0.0.0
      - CONSILO_BRIDGE_PORT=8090
    volumes:
      - ./vault:/app/vault
      - ./data:/app/data
      - ./tasks:/app/tasks
    depends_on: [qdrant]

  consilo-dashboard:
    image: consilo:local
    restart: unless-stopped
    command: ["python", "-m", "consilo.dashboard.server"]
    network_mode: "host"
    env_file:
      - .env
    environment:
      - CONSILO_DASHBOARD_HOST=0.0.0.0
      - CONSILO_DASHBOARD_PORT=8091
    volumes:
      - ./vault:/app/vault
      - ./data:/app/data
      - ./tasks:/app/tasks
    depends_on: [qdrant, consilo-bridge]

  consilo-worker:
    image: consilo:local
    restart: unless-stopped
    command: ["python", "-m", "consilo.cli", "worker", "--interval", "300"]
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./vault:/app/vault
      - ./data:/app/data
      - ./tasks:/app/tasks
    depends_on: [qdrant, consilo-bridge]
