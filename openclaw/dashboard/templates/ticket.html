{% extends "base.html" %}
{% block title %}{{ ticket.id }} — {{ ticket.title }}{% endblock %}
{% block body %}
<div class="flex items-center mb-4">
  <div>
    <div class="text-xs text-slate-500">{{ client }} / {{ project }}</div>
    <h1 class="text-2xl font-bold">{{ ticket.id }} — {{ ticket.title }}</h1>
  </div>
  <div class="ml-auto text-sm">
    <a class="text-slate-500 hover:underline"
       href="/board?client={{ client }}&project={{ project }}">← back to board</a>
  </div>
</div>

<div id="ticket-panel">
  {% include "_ticket_panel.html" %}
</div>
{% endblock %}
