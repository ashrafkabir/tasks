{% extends "base.html" %}
{% block title %}OpenClaw — new task{% endblock %}
{% block body %}
<div class="max-w-xl mx-auto bg-white border border-slate-200 rounded shadow-sm p-6">
  <h1 class="text-2xl font-bold mb-1">Start a new task</h1>
  <p class="text-slate-500 text-sm mb-4">
    Creates the project folder and a <code class="bg-slate-100 px-1 rounded">prd_answers.yaml</code>
    skeleton, then takes you to the PRD composer. Both <code class="bg-slate-100 px-1 rounded">client</code>
    and <code class="bg-slate-100 px-1 rounded">project</code> should be lowercase kebab-case slugs.
  </p>

  <form method="post" action="/new-task" class="space-y-3">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Client slug</span>
      <input name="client" required pattern="[a-z0-9][a-z0-9-]*"
             placeholder="e.g. acme"
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Project slug</span>
      <input name="project" required pattern="[a-z0-9][a-z0-9-]*"
             placeholder="e.g. board-pitch"
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </label>
    <div class="flex gap-2 pt-2">
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded">
        Start
      </button>
      <a href="/" class="text-sm text-slate-500 hover:underline self-center">cancel</a>
    </div>
  </form>
</div>
{% endblock %}
