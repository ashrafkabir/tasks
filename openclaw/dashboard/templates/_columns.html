{% if flash is defined and flash %}
<div class="mb-3 px-4 py-2 rounded text-sm
  {% if flash.ok %}bg-emerald-50 text-emerald-800 border border-emerald-200
  {% else %}bg-rose-50 text-rose-800 border border-rose-200{% endif %}">
  {{ flash.msg }}
</div>
{% endif %}
<div class="grid grid-cols-1 md:grid-cols-5 gap-3">
  {% for col in column_order %}
  <div class="bg-slate-100 rounded p-2 min-h-[120px]">
    <div class="col-header flex items-center">
      <span>{{ column_labels[col] }}</span>
      <span class="ml-auto text-slate-400 font-normal">{{ columns[col]|length }}</span>
    </div>
    {% for t in columns[col] %}
    <a href="/tickets/{{ t.id }}?client={{ client }}&project={{ project }}"
       class="block col-card">
      <div class="text-xs text-slate-500 mb-0.5">{{ t.id }}</div>
      <div class="text-sm font-medium leading-snug">{{ t.title }}</div>
      <div class="mt-1 flex items-center gap-2">
        <span class="badge-state
          {% if t.state == 'backlog' %}bg-slate-200 text-slate-700
          {% elif t.state == 'in_progress' %}bg-blue-100 text-blue-800
          {% elif t.state == 'awaiting_approval' %}bg-amber-100 text-amber-800
          {% elif t.state == 'approved' %}bg-emerald-100 text-emerald-800
          {% elif t.state == 'done' %}bg-slate-200 text-slate-700
          {% endif %}">{{ t.state }}</span>
        <span class="text-xs text-slate-400">{{ t.kind }}</span>
      </div>
    </a>
    {% endfor %}
    {% if not columns[col] %}
    <div class="text-xs text-slate-400 italic px-1">empty</div>
    {% endif %}
  </div>
  {% endfor %}
</div>
