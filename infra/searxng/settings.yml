# Minimal SearXNG settings. Copy/extend as needed; full reference at
# https://docs.searxng.org/admin/settings/index.html
use_default_settings: true

server:
  secret_key: "change-me-on-first-use"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: false
  image_proxy: false
  http_protocol_version: "1.1"

search:
  safe_search: 0
  formats:
    - html
    - json

ui:
  static_use_hash: true
